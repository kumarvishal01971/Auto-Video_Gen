<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Promo Video Pipeline{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{--ink:#1f2328;--mute:#5b6370;--line:#e3e6ea;--bg:#f6f7f9;--blue:#d6e6fb;--peach:#fde3cf;--pink:#f9d5e3;--green:#d8f0de;--red:#fbe0e0;--accent:#0b3d91}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px}
header a.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:17px}
main{max-width:1180px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}.btn.ok{background:#1f883d;color:#fff}.btn.warn{background:#fff;color:#b5562c;border:1.5px solid #b5562c}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600}
.b-run{background:var(--blue)}.b-wait{background:var(--pink)}.b-done{background:var(--green)}.b-fail{background:var(--red)}.b-q{background:#eee}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:70px}label{font-weight:600;font-size:13.5px;display:block;margin:10px 0 4px}
.hint{color:var(--mute);font-size:12.5px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.muted{color:var(--mute)}
.provider{font-size:12px;color:var(--mute);margin-left:auto}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style></head>
<body><header><a class="brand" href="/">🎬 Promo Video Pipeline</a><a class="btn primary" href="/new">+ New brief</a>{% block hdr %}{% endblock %}</header>
<main>{% block body %}{% endblock %}</main></body></html>
